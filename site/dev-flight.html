<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Flight strip · dev</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/flight.css">
  <style>
    .dev-pad { height: 96px; }
    .dev-ctl { display: flex; align-items: center; gap: 16px; padding: 18px var(--gutter); }
    .dev-ctl input { flex: 1; }
    .dev-ctl output { min-width: 3ch; text-align: right; }
    .fps { position: fixed; right: 12px; bottom: 10px; font: 400 10px/14px var(--mono); color: var(--muted); }
  </style>
  <script>
    // ?timer: frames come from setTimeout, so the strip runs in a hidden tab (where rAF stalls).
    // ?manual: frames advance only when you call advance(ms), for exact mid-transition captures.
    // ?reduce: pretend prefers-reduced-motion is on.
    window.__raf = 0;
    if (location.search.includes("reduce")) {
      const mm = window.matchMedia.bind(window);
      window.matchMedia = (q) => q.includes("reduced-motion") ? { matches: true, media: q, addEventListener() {}, removeEventListener() {} } : mm(q);
    }
    if (location.search.includes("manual")) {
      let pending = [], now = performance.now(), id = 0;
      window.requestAnimationFrame = (cb) => { window.__raf++; pending.push({ id: ++id, cb }); return id; };
      window.cancelAnimationFrame = (x) => { pending = pending.filter((p) => p.id !== x); };
      window.advance = (ms, step = 16) => { for (let t = 0; t < ms; t += step) { now += step; const run = pending; pending = []; for (const p of run) p.cb(now); } };
      performance.now = () => now;
    } else if (location.search.includes("timer")) {
      window.requestAnimationFrame = (cb) => { window.__raf++; return setTimeout(() => cb(performance.now()), 16); };
      window.cancelAnimationFrame = (id) => clearTimeout(id);
    } else {
      const raf = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = (cb) => { window.__raf++; return raf(cb); };
    }
  </script>
</head>
<body>
  <div class="dev-pad"></div>
  <div id="flight"></div>
  <div class="dev-ctl mono">
    <input id="n" type="range" min="0" max="8" step="1" value="0" aria-label="Funded seats">
    <output id="out" class="muted">0</output>
  </div>
  <p class="fps" id="fps"></p>
  <script type="module">
    import { flightStrip } from "./js/flight.js";
    const q = new URLSearchParams(location.search);
    if (q.has("nopad")) document.querySelector(".dev-pad").style.height = "0";
    // ?far: the strip starts 4 screens down, to test that nothing heavy is built before it is near
    if (q.has("far")) { document.querySelector(".dev-pad").style.height = 4 * innerHeight + "px"; document.body.style.minHeight = 6 * innerHeight + "px"; }
    window.__long = [];
    window.__flightProbe = (p) => { window.flightProbe = p; };
    try { new PerformanceObserver((l) => { for (const e of l.getEntries()) window.__long.push(Math.round(e.duration)); }).observe({ type: "longtask", buffered: true }); } catch {}
    // ?w=1440 pins the strip's width; ?z=3 magnifies it (a transform, layout untouched) to inspect detail.
    const host = document.getElementById("flight"), z = +q.get("z") || 1;
    if (q.get("w") || z !== 1) { host.style.width = (+q.get("w") || innerWidth) + "px"; document.body.style.overflow = "auto"; }
    if (z !== 1) { host.style.transform = `scale(${z})`; host.style.transformOrigin = "0 0"; document.body.style.width = z * (+q.get("w") || innerWidth) + "px"; document.body.style.height = "3000px"; }
    window.look = (x, y) => scrollTo(x * z, 96 + y * z);
    const strip = flightStrip(host);
    const n = document.getElementById("n"), out = document.getElementById("out");
    if (q.get("n")) n.value = q.get("n");
    const go = () => { strip.set(+n.value); out.textContent = n.value; };
    n.addEventListener("input", go);
    go();
    window.strip = strip;
    // frames per second, from the strip's own frame requests
    let seen = window.__raf, t0 = performance.now();
    setInterval(() => { const t = performance.now(); document.getElementById("fps").textContent = `${Math.round((window.__raf - seen) * 1000 / (t - t0))} fps`; seen = window.__raf; t0 = t; }, 1000);
  </script>
</body>
</html>
