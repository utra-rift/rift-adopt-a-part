<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Tier slider · dev</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/tierslider.css">
  <style>
    .dev { padding: 48px var(--gutter) 96px; display: grid; gap: 72px; }
    .dev h2 { margin: 0 0 36px; font: 400 11px/16px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .dev .log { margin-top: 24px; font: 400 11px/16px var(--mono); color: #555; }
    .fps { position: fixed; right: 12px; bottom: 10px; font: 400 10px/14px var(--mono); color: var(--muted); }
  </style>
  <script>
    // Count animation frames so we can see the loop go idle. With ?timer, frames come from
    // setTimeout so the loop can be measured in a hidden tab, where real rAF never fires.
    window.__raf = 0;
    // ?reduce pretends prefers-reduced-motion is on (the browser pane can't emulate it).
    if (location.search.includes("reduce")) {
      const mm = window.matchMedia.bind(window);
      window.matchMedia = (q) => q.includes("reduced-motion")
        ? { matches: true, media: q, addEventListener() {}, removeEventListener() {} }
        : mm(q);
    }
    if (location.search.includes("manual")) {
      // ?manual: frames only advance when you call advance(ms), for exact mid-effect screenshots.
      let pending = [], now = performance.now(), id = 0;
      window.requestAnimationFrame = (cb) => { window.__raf++; pending.push({ id: ++id, cb }); return id; };
      window.cancelAnimationFrame = (x) => { pending = pending.filter((p) => p.id !== x); };
      window.advance = (ms) => {
        for (let t = 0; t < ms; t += 16) {
          now += 16;
          const run = pending; pending = [];
          for (const p of run) p.cb(now);
        }
      };
      performance.now = () => now;
    } else if (location.search.includes("timer")) {
      window.requestAnimationFrame = (cb) => { window.__raf++; return setTimeout(() => cb(performance.now()), 16); };
      window.cancelAnimationFrame = (id) => clearTimeout(id);
    } else {
      const raf = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = (cb) => { window.__raf++; return raf(cb); };
    }
  </script>
</head>
<body>
  <main class="dev">
    <section>
      <h2>Drive · km</h2>
      <div id="drive"></div>
      <p class="log" id="drive-log"></p>
    </section>
    <section>
      <h2>Flights · seats</h2>
      <div id="flights"></div>
      <p class="log" id="flights-log"></p>
    </section>
  </main>
  <p class="fps" id="fps"></p>

  <script type="module" src="/dev/dev-slider.ts"></script>
</body>
</html>
