<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cabin strip (dev)</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/cabin.css">
  <style>
    .dev-pad { height: 120px; }
    .dev-ctl { display: flex; align-items: center; gap: 16px; padding: 18px var(--gutter); }
    .dev-ctl input { flex: 1; }
    .dev-ctl output { min-width: 3ch; text-align: right; }
  </style>
</head>
<body>
  <div class="dev-pad"></div>
  <div id="cabin"></div>
  <div class="dev-ctl mono">
    <input id="n" type="range" min="0" max="8" step="1" value="0" aria-label="Funded seats">
    <output id="out" class="muted">0</output>
  </div>
  <script type="module">
    import { cabinStrip } from "./js/cabin.js";
    // ?w=1440&x=600 pins the strip to a width and scrolls to x, to inspect it at 1:1 in a small window.
    const q = new URLSearchParams(location.search);
    if (q.get("w")) { const h = document.getElementById("cabin"); h.style.width = q.get("w") + "px"; document.body.style.overflowX = "auto"; }
    // ?z=3 magnifies the strip (a CSS transform, so layout is untouched) to inspect fine detail.
    const z = +q.get("z") || 1;
    if (z !== 1) { const h = document.getElementById("cabin"); h.style.width = (+q.get("w") || innerWidth) + "px"; h.style.transform = `scale(${z})`; h.style.transformOrigin = "0 0"; document.body.style.overflow = "auto"; document.body.style.height = "4000px"; document.body.style.width = (z * (+q.get("w") || innerWidth)) + "px"; }
    if (q.get("n")) document.getElementById("n").value = q.get("n");
    const strip = cabinStrip(document.getElementById("cabin"));
    const n = document.getElementById("n"), out = document.getElementById("out");
    const go = () => { strip.set(+n.value); out.textContent = n.value; };
    n.addEventListener("input", go);
    go();
    window.strip = strip;
    if (q.get("x") || q.get("y")) setTimeout(() => scrollTo((+q.get("x") || 0) * z, (+q.get("y") || 0) * z + 120), 300);
  </script>
</body>
</html>
