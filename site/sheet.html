<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sheet</title>
<style>
  html, body { margin: 0; background: #fff; font: 11px/1.4 ui-monospace, monospace; color: #555; }
  main { display: grid; grid-template-columns: repeat(var(--cols, 4), 300px); gap: 0; padding: 12px; }
  .c { position: relative; width: 300px; }
  .fig { position: relative; aspect-ratio: 1 / .86; outline: 1px solid #f1d4d4; outline-offset: -1px; }
  .fig canvas { position: absolute; inset: 0; width: 100%; height: 100%;
    mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
    mask-composite: intersect; }
  p { margin: 4px 0 14px; text-align: center; }
</style></head>
<body><main id="m"></main>
<script type="module" src="/dev/sheet.ts"></script></body></html>
