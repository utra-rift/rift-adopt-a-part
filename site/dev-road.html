<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Road strip · dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/road.css">
  <style>
    .dev-pad { padding: 24px var(--gutter); }
    .dev-pad input { display: block; width: 100%; margin: 0; }
    .dev-row { display: flex; justify-content: space-between; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="dev-pad"><p class="mono muted">Road strip (dev only)</p></div>
  <div id="road"></div>
  <div class="dev-pad">
    <input id="f" type="range" min="0" max="1" step="0.001" value="0" aria-label="Share funded">
    <div class="dev-row mono muted"><span id="o">0%</span><span>set(f)</span></div>
  </div>
  <script type="module">
    // ?shim: drive frames from timers, for testing in a hidden or background tab.
    // (A hidden page gets no frames and no intersection callbacks, so both are stood in for.)
    if (new URLSearchParams(location.search).has("shim")) {
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
      document.head.insertAdjacentHTML("beforeend", "<style>.road-canvas, .road-map::before { transition: none !important; }</style>");
      window.IntersectionObserver = class { constructor(cb) { this.cb = cb; } observe(t) { setTimeout(() => this.cb([{ isIntersecting: true, target: t }]), 0); } disconnect() {} };
    }
    // Cache-busted so edits always load.
    const { roadStrip } = await import("./js/road.js?v=" + Date.now());
    // Inspection: ?w=1440&x=600&y=0&z=2 lays the strip out at a fixed width, magnifies it by z and shows it from (x, y).
    const qs = new URLSearchParams(location.search), host = document.getElementById("road");
    if (qs.get("w")) {
      document.body.style.overflow = "hidden";
      document.querySelector(".dev-pad").remove();
      host.style.width = qs.get("w") + "px";
      const z = +qs.get("z") || 1, x = +qs.get("x") || 0, y = +qs.get("y") || 0;
      host.style.transformOrigin = "0 0";
      host.style.transform = `translate(${-x * z}px, ${-y * z}px) scale(${z})`;
    }
    const strip = roadStrip(host);
    window.__road = strip;
    const f = document.getElementById("f"), o = document.getElementById("o");
    const q = qs.get("f");
    if (q !== null) f.value = q;
    const sync = () => { strip.set(+f.value); o.textContent = Math.round(f.value * 100) + "%"; };
    f.addEventListener("input", sync);
    sync();
  </script>
</body>
</html>
