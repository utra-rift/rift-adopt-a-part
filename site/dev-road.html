<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Road strip · dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/road.css">
  <style>
    .dev-pad { padding: 24px var(--gutter); }
    .dev-pad input { display: block; width: 100%; margin: 0; }
    .dev-row { display: flex; justify-content: space-between; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="dev-pad"><p class="mono muted">Road strip (dev only)</p></div>
  <div id="road"></div>
  <div class="dev-pad">
    <input id="f" type="range" min="0" max="1" step="0.001" value="0" aria-label="Share funded">
    <div class="dev-row mono muted"><span id="o">0%</span><span>set(f)</span></div>
  </div>
  <script type="module" src="/dev/dev-road.ts"></script>
</body>
</html>
